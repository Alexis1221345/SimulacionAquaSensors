<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AquaSensors — Simulador</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }

body {
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  background: #0f1117;
  color: #e2e8f0;
  min-height: 100vh;
  font-size: 14px;
}

/* ── Header ── */
header {
  background: #1a1d2e;
  border-bottom: 1px solid #2d3748;
  padding: 14px 24px;
  display: flex;
  align-items: center;
  justify-content: space-between;
}
.logo { display: flex; align-items: center; gap: 10px; }
.logo-icon {
  width: 32px; height: 32px; border-radius: 8px;
  background: linear-gradient(135deg, #3b82f6, #06b6d4);
  display: flex; align-items: center; justify-content: center;
  font-size: 16px;
}
.logo-text { font-size: 16px; font-weight: 600; color: #f1f5f9; }
.logo-sub  { font-size: 11px; color: #64748b; margin-top: 1px; }

.header-right { display: flex; align-items: center; gap: 10px; }

#bombas-badge {
  padding: 5px 14px; border-radius: 20px; font-size: 12px; font-weight: 600;
  background: #052e16; color: #4ade80; border: 1px solid #166534;
  transition: all 0.3s; letter-spacing: 0.02em;
}
#bombas-badge.on { background: #450a0a; color: #f87171; border-color: #7f1d1d; }

/* ── Layout ── */
.main { display: grid; grid-template-columns: 280px 1fr; gap: 0; min-height: calc(100vh - 57px); }

/* ── Sidebar ── */
aside {
  background: #13151f;
  border-right: 1px solid #1e2333;
  padding: 20px 16px;
  display: flex;
  flex-direction: column;
  gap: 20px;
}

.section-title {
  font-size: 10px; font-weight: 600; letter-spacing: 0.1em;
  color: #475569; text-transform: uppercase; margin-bottom: 10px;
}

/* ── Botones de modo ── */
.modo-btn {
  width: 100%; padding: 16px 12px; border-radius: 10px;
  border: 2px solid transparent; cursor: pointer;
  font-size: 14px; font-weight: 600; transition: all 0.2s;
  display: flex; align-items: center; gap: 10px;
  margin-bottom: 8px;
}
.modo-btn .ico { font-size: 22px; }
.modo-btn .info { text-align: left; }
.modo-btn .info .titulo { font-size: 14px; font-weight: 600; }
.modo-btn .info .sub { font-size: 11px; margin-top: 2px; opacity: 0.75; }

#btn-normal {
  background: #1e2b42; color: #93c5fd; border-color: #1e3a5f;
}
#btn-normal.activo {
  background: #1d3a6e; color: #bfdbfe; border-color: #3b82f6;
  box-shadow: 0 0 0 1px #3b82f6;
}
#btn-normal:hover:not(.activo) { border-color: #2d5a9e; }

#btn-lluvia {
  background: #1e1b42; color: #c4b5fd; border-color: #2e2060;
}
#btn-lluvia.activo {
  background: #3b1d6e; color: #ddd6fe; border-color: #7c3aed;
  box-shadow: 0 0 0 1px #7c3aed;
}
#btn-lluvia:hover:not(.activo) { border-color: #5b21b6; }

/* ── Info clima ── */
.clima-info {
  background: #1a1d2e; border: 1px solid #1e2333; border-radius: 8px;
  padding: 12px 14px;
}
.clima-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px; }
.clima-row:last-child { margin-bottom: 0; }
.clima-key { font-size: 11px; color: #64748b; }
.clima-val { font-size: 13px; font-weight: 600; color: #e2e8f0; }

/* ── Log ── */
.log-box {
  background: #0d0f17; border: 1px solid #1e2333; border-radius: 8px;
  padding: 12px; height: 200px; overflow-y: auto; font-family: monospace;
  font-size: 11px; line-height: 1.7; flex: 1;
}
.log-line { color: #64748b; }
.log-line.info    { color: #60a5fa; }
.log-line.success { color: #4ade80; }
.log-line.warning { color: #fbbf24; }
.log-line.error   { color: #f87171; }
.log-line.rain    { color: #a78bfa; }

/* ── Contenido ── */
.content { padding: 20px; overflow-y: auto; display: flex; flex-direction: column; gap: 16px; }

/* ── Stats ── */
.stats-row {
  display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px;
}
.stat-cell {
  background: #1a1d2e; border-radius: 8px; padding: 12px;
  border: 1px solid #1e2333; text-align: center;
}
.stat-num   { font-size: 22px; font-weight: 700; color: #3b82f6; }
.stat-label { font-size: 10px; color: #475569; margin-top: 2px; text-transform: uppercase; letter-spacing: 0.05em; }

/* ── Tabs ── */
.tabs { display: flex; gap: 4px; border-bottom: 1px solid #1e2333; margin-bottom: 16px; }
.tab {
  padding: 8px 16px; font-size: 12px; font-weight: 500; cursor: pointer;
  color: #64748b; border-bottom: 2px solid transparent; margin-bottom: -1px;
  transition: all 0.2s;
}
.tab.active { color: #3b82f6; border-bottom-color: #3b82f6; }
.tab:hover:not(.active) { color: #94a3b8; }
.tab-content { display: none; }
.tab-content.active { display: block; }

/* ── Pool cards ── */
.pool-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 16px; }
.pool-card {
  background: #1a1d2e; border: 1px solid #1e2333; border-radius: 12px; padding: 16px;
  transition: border-color 0.3s;
}
.pool-card.alerta  { border-color: #f59e0b; }
.pool-card.critico { border-color: #ef4444; }
.pool-header {
  display: flex; align-items: center; justify-content: space-between; margin-bottom: 14px;
}
.pool-nombre { font-size: 13px; font-weight: 600; color: #f1f5f9; }
.pool-ciclo  { font-size: 11px; color: #475569; }

.params-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.param-cell {
  background: #0f1117; border-radius: 8px; padding: 10px; border: 1px solid #1e2333;
}
.param-label  { font-size: 10px; color: #475569; text-transform: uppercase; letter-spacing: 0.05em; }
.param-valor  { font-size: 20px; font-weight: 700; margin: 2px 0; }
.param-unit   { font-size: 10px; color: #475569; }
.param-status { font-size: 10px; margin-top: 4px; font-weight: 500; }
.val-optimo   { color: #4ade80; }
.val-alerta   { color: #fbbf24; }
.val-critico  { color: #f87171; }

.temp-row { display: flex; gap: 8px; margin-top: 8px; }
.temp-cell {
  flex: 1; background: #0f1117; border-radius: 8px; padding: 8px 10px;
  border: 1px solid #1e2333; display: flex; align-items: center; justify-content: space-between;
}
.temp-cell .label { font-size: 10px; color: #475569; }
.temp-cell .valor { font-size: 14px; font-weight: 600; color: #60a5fa; }

.bomba-row {
  margin-top: 8px; padding: 7px 10px; border-radius: 6px;
  display: flex; align-items: center; justify-content: space-between;
  font-size: 11px; font-weight: 500;
  background: #0f1117; border: 1px solid #1e2333;
}
.bomba-off { color: #4ade80; }
.bomba-on  { color: #f87171; }

/* ── Alertas ── */
.alerts-list { display: flex; flex-direction: column; gap: 8px; }
.alert-item {
  background: #1a1d2e; border-radius: 8px; padding: 12px 14px;
  border-left: 3px solid #2d3748; display: flex;
  align-items: center; justify-content: space-between; gap: 12px;
}
.alert-item.alerta  { border-left-color: #f59e0b; }
.alert-item.critico { border-left-color: #ef4444; }
.alert-msg  { font-size: 12px; color: #cbd5e1; }
.alert-pool { font-size: 11px; color: #475569; margin-top: 2px; }
.alert-time { font-size: 10px; color: #475569; white-space: nowrap; }
</style>
</head>
<body>

<header>
  <div class="logo">
    <div class="logo-icon">💧</div>
    <div>
      <div class="logo-text">AquaSensors</div>
      <div class="logo-sub">Simulador controlado v2</div>
    </div>
  </div>
  <div class="header-right">
    <div id="modo-label" style="font-size:12px;color:#64748b;">Modo: —</div>
    <div id="bombas-badge">Bombas OFF</div>
  </div>
</header>

<div class="main">

  <!-- ══ SIDEBAR ══ -->
  <aside>

    <!-- Botones de modo -->
    <div>
      <div class="section-title">Modo de simulación</div>

      <button class="modo-btn activo" id="btn-normal" onclick="cambiarModo('normal')">
        <span class="ico">☀️</span>
        <div class="info">
          <div class="titulo">Día normal</div>
          <div class="sub" id="sub-normal">T° amb 27°C · T° agua 27°C</div>
        </div>
      </button>

      <button class="modo-btn" id="btn-lluvia" onclick="cambiarModo('lluvia')">
        <span class="ico">🌧️</span>
        <div class="info">
          <div class="titulo">Día lluvioso</div>
          <div class="sub" id="sub-lluvia">T° amb 18–20°C · T° agua 22–24°C</div>
        </div>
      </button>
    </div>

    <!-- Info clima actual -->
    <div>
      <div class="section-title">Condiciones activas</div>
      <div class="clima-info">
        <div class="clima-row">
          <span class="clima-key">T° ambiente</span>
          <span class="clima-val" id="ci-tamb">27°C</span>
        </div>
        <div class="clima-row">
          <span class="clima-key">T° agua</span>
          <span class="clima-val" id="ci-tagua">27°C</span>
        </div>
        <div class="clima-row">
          <span class="clima-key">Ciclos</span>
          <span class="clima-val" id="ci-ciclos">0</span>
        </div>
        <div class="clima-row">
          <span class="clima-key">Bombas dosif.</span>
          <span class="clima-val" id="ci-bombas" style="color:#4ade80;">OFF</span>
        </div>
      </div>
    </div>

    <!-- Log -->
    <div style="display:flex;flex-direction:column;flex:1;gap:6px;">
      <div class="section-title">Registro</div>
      <div class="log-box" id="log-box">
        <div class="log-line info">AquaSensors Simulador v2 — iniciando...</div>
      </div>
    </div>

  </aside>

  <!-- ══ CONTENIDO PRINCIPAL ══ -->
  <div class="content">

    <div class="stats-row">
      <div class="stat-cell">
        <div class="stat-num" id="stat-ciclos">0</div>
        <div class="stat-label">Ciclos</div>
      </div>
      <div class="stat-cell">
        <div class="stat-num" id="stat-alertas">0</div>
        <div class="stat-label">Alertas</div>
      </div>
      <div class="stat-cell">
        <div class="stat-num" id="stat-criticos">0</div>
        <div class="stat-label">Críticos</div>
      </div>
    </div>

    <!-- Tabs -->
    <div class="tabs">
      <div class="tab active" onclick="showTab('albercas')">Albercas</div>
      <div class="tab" onclick="showTab('alertas')">Alertas</div>
    </div>

    <div class="tab-content active" id="tab-albercas">
      <div class="pool-grid" id="pool-cards">
        <div style="color:#475569;font-size:13px;padding:20px;">Conectando al servidor...</div>
      </div>
    </div>

    <div class="tab-content" id="tab-alertas">
      <div class="alerts-list" id="alerts-list">
        <div style="color:#475569;font-size:13px;padding:20px;">Sin alertas recientes.</div>
      </div>
    </div>

  </div>
</div>

<script>
let ws = null;

// ── WebSocket ─────────────────────────────────────────────────────
function conectarWS() {
  ws = new WebSocket(`${location.protocol === 'https:' ? 'wss' : 'ws'}://${location.host}`);
  ws.onopen  = () => log('Conectado al servidor', 'success');
  ws.onmessage = (e) => actualizarEstado(JSON.parse(e.data));
  ws.onclose = () => {
    log('Reconectando en 3s...', 'warning');
    setTimeout(conectarWS, 3000);
  };
}

// ── Cambiar modo ──────────────────────────────────────────────────
async function cambiarModo(modo) {
  log(`Cambiando a modo: ${modo}...`, 'info');
  const res  = await fetch('/api/modo', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ modo }),
  });
  const data = await res.json();
  if (data.error) { log(data.error, 'error'); return; }

  // Actualizar botones
  document.getElementById('btn-normal').classList.toggle('activo', modo === 'normal');
  document.getElementById('btn-lluvia').classList.toggle('activo', modo === 'lluvia');

  if (modo === 'lluvia') {
    document.getElementById('sub-lluvia').textContent =
      `T° amb ${data.tempAmbiente}°C · T° agua ${data.tempAgua}°C`;
    log(`Modo LLUVIA activado | T°amb ${data.tempAmbiente}°C | T°agua ${data.tempAgua}°C | Bombas ON`, 'rain');
  } else {
    log('Modo NORMAL activado | T°amb 27°C | T°agua 27°C | Bombas OFF', 'success');
  }
}

// ── Actualizar estado desde WS ────────────────────────────────────
function actualizarEstado(data) {
  const cond = data.condiciones;
  if (!cond) return;

  // Header
  document.getElementById('modo-label').textContent = 'Modo: ' + (cond.modoNombre || '—');
  const bb = document.getElementById('bombas-badge');
  bb.textContent = cond.bombas ? 'Bombas ON' : 'Bombas OFF';
  bb.className   = cond.bombas ? 'on' : '';

  // Sidebar info
  document.getElementById('ci-tamb').textContent   = cond.tempAmbiente + '°C';
  document.getElementById('ci-tagua').textContent  = cond.tempAgua + '°C';
  document.getElementById('ci-ciclos').textContent = data.ciclosHechos || 0;
  const bc = document.getElementById('ci-bombas');
  bc.textContent  = cond.bombas ? 'ON' : 'OFF';
  bc.style.color  = cond.bombas ? '#f87171' : '#4ade80';

  // Stats
  document.getElementById('stat-ciclos').textContent = data.ciclosHechos || 0;

  // Cards
  if (data.pools && data.pools.length > 0) renderPoolCards(data.pools);

  // Alertas
  cargarAlertas();
}

// ── Render pool cards ─────────────────────────────────────────────
function renderPoolCards(pools) {
  document.getElementById('pool-cards').innerHTML = pools.map(pool => {
    const nivel = nivelCard(pool);
    return `
    <div class="pool-card ${nivel}">
      <div class="pool-header">
        <div class="pool-nombre">${pool.nombre}</div>
        <div class="pool-ciclo">Ciclo ${pool.ciclo}</div>
      </div>
      <div class="params-grid">
        ${paramCell('Cloro', pool.cloro, 'ppm', stCloro(pool.cloro))}
        ${paramCell('pH', pool.ph, '', stPh(pool.ph))}
        ${paramCell('Turbidez / Alguicida', pool.turbidez, 'NTU', stTurb(pool.turbidez))}
        ${paramCell('Clarificador', pool.turbidez > 1.0 ? 'Bajo' : 'Normal', '', pool.turbidez > 1.0 ? 'alerta' : 'optimo')}
      </div>
      <div class="temp-row">
        <div class="temp-cell">
          <span class="label">T° agua</span>
          <span class="valor">${pool.temp_agua}°C</span>
        </div>
        <div class="temp-cell">
          <span class="label">T° ambiente</span>
          <span class="valor">${pool.temp_ambiente}°C</span>
        </div>
      </div>
      <div class="bomba-row">
        <span>Microbombas dosificación</span>
        <span class="${pool.bombas ? 'bomba-on' : 'bomba-off'}">${pool.bombas ? 'ON' : 'OFF'}</span>
      </div>
    </div>`;
  }).join('');
}

function paramCell(label, valor, unit, st) {
  const cls = st === 'optimo' ? 'val-optimo' : st === 'alerta' ? 'val-alerta' : 'val-critico';
  const stLabel = st === 'optimo' ? 'Óptimo' : st === 'alerta' ? 'Alerta' : 'Crítico';
  return `
    <div class="param-cell">
      <div class="param-label">${label}</div>
      <div class="param-valor ${cls}">${valor}</div>
      <div class="param-unit">${unit}</div>
      <div class="param-status ${cls}">${stLabel}</div>
    </div>`;
}

function stCloro(v) { return v < 0.5 || v > 5.0 ? 'critico' : v < 1.0 || v > 3.0 ? 'alerta' : 'optimo'; }
function stPh(v)    { return v < 6.8 || v > 8.2 ? 'critico' : v < 7.2 || v > 7.8 ? 'alerta' : 'optimo'; }
function stTurb(v)  { return v > 4.0 ? 'critico' : v > 1.0 ? 'alerta' : 'optimo'; }
function nivelCard(p) {
  if (p.cloro < 0.5 || p.ph < 6.8 || p.ph > 8.2 || p.turbidez > 4) return 'critico';
  if (p.cloro < 1.0 || p.ph < 7.2 || p.ph > 7.8 || p.turbidez > 1) return 'alerta';
  return '';
}

// ── Alertas ───────────────────────────────────────────────────────
async function cargarAlertas() {
  const res  = await fetch('/api/alertas');
  const data = await res.json();
  let alertaCount = 0, criticoCount = 0;
  data.forEach(a => {
    if (!a.resuelta) {
      if (a.nivel === 'critico') criticoCount++;
      else alertaCount++;
    }
  });
  document.getElementById('stat-alertas').textContent  = alertaCount + criticoCount;
  document.getElementById('stat-criticos').textContent = criticoCount;

  const container = document.getElementById('alerts-list');
  if (!data.length) {
    container.innerHTML = '<div style="color:#475569;font-size:13px;padding:20px;">Sin alertas recientes.</div>';
    return;
  }
  container.innerHTML = data.map(a => {
    const fecha = new Date(a.created_at).toLocaleString('es-MX',
      { hour: '2-digit', minute: '2-digit', day: '2-digit', month: '2-digit' });
    return `
      <div class="alert-item ${a.nivel}">
        <div>
          <div class="alert-msg">${a.mensaje}</div>
          <div class="alert-pool">${a.pools?.nombre || ''} · ${a.parametro}</div>
        </div>
        <div class="alert-time">${fecha}</div>
      </div>`;
  }).join('');
}

// ── Tabs ──────────────────────────────────────────────────────────
function showTab(name) {
  document.querySelectorAll('.tab').forEach((t, i) => {
    t.classList.toggle('active', ['albercas','alertas'][i] === name);
  });
  document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
  document.getElementById(`tab-${name}`).classList.add('active');
  if (name === 'alertas') cargarAlertas();
}

// ── Log ───────────────────────────────────────────────────────────
function log(msg, tipo = 'log') {
  const box  = document.getElementById('log-box');
  const hora = new Date().toLocaleTimeString('es-MX',
    { hour: '2-digit', minute: '2-digit', second: '2-digit' });
  const div  = document.createElement('div');
  div.className   = `log-line ${tipo}`;
  div.textContent = `[${hora}] ${msg}`;
  box.appendChild(div);
  box.scrollTop = box.scrollHeight;
}

// ── Init ──────────────────────────────────────────────────────────
conectarWS();
setInterval(cargarAlertas, 15000);
</script>
</body>
</html>
